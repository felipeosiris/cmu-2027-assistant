services:
  - type: web
    name: cmu-2027-assistant
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: VAULT_CWD
        value: /opt/render/project/src/vault
      - key: CURSOR_MODEL
        value: auto
      - key: CURSOR_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TTS_VOICE
        value: es-MX-DaliaNeural
      - key: CMU_AGENT_RUNTIME
        value: cloud

  # Backend aparte RichardFlix Deportes (proxy SportSRC + caché)
  - type: web
    name: richardflix-sports
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev
    startCommand: npx tsx server/richardflixIndex.ts
    healthCheckPath: /rf/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SPORTSRC_API_KEY
        sync: false
