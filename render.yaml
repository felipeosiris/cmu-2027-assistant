services:
  - type: web
    name: cmu-2027-assistant
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: VAULT_CWD
        value: /opt/render/project/src/vault
      - key: CURSOR_MODEL
        value: auto
      - key: CURSOR_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TTS_VOICE
        value: es-MX-DaliaNeural
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: hpp4J3VqNfWAUOO0d1Us
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
      - key: CMU_AGENT_RUNTIME
        value: cloud
