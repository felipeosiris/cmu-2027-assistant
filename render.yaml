services:
  - type: web
    name: cmu-2027-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CURSOR_API_KEY
        sync: false
      - key: VAULT_CWD
        value: /opt/render/project/src/vault
      - key: CURSOR_MODEL
        value: auto
